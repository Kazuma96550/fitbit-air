name: Native source feasibility

on:
  push:
    branches: [investigate/source-built-native]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"'
      - name: Compile source core and JNI bridge
        run: python3 tool/native-proof/build.py --ndk "$ANDROID_HOME/ndk/28.2.13676358"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-gate-source-proof-arm64
          path: build/native-source-proof/artifact/
          if-no-files-found: warn
