name: Release Air Relay

# Builds Air Relay for a version tag (v1.2.3) and attaches the signed APK to
# the GitHub release. Also uploads the App Bundle for Google Play.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.AIR_RELAY_KEYSTORE_BASE64 }}
        run: |
          # Never publish a debug-signed build.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the AIR_RELAY_* release-key secrets first (see doc/release.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/air-relay.jks"
          echo "AIR_RELAY_KEYSTORE=$RUNNER_TEMP/air-relay.jks" >> "$GITHUB_ENV"
      - name: Build APK and App Bundle
        working-directory: example
        env:
          AIR_RELAY_KEYSTORE_PASSWORD: ${{ secrets.AIR_RELAY_KEYSTORE_PASSWORD }}
          AIR_RELAY_KEY_ALIAS: ${{ secrets.AIR_RELAY_KEY_ALIAS }}
          AIR_RELAY_KEY_PASSWORD: ${{ secrets.AIR_RELAY_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Check the signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs example/build/app/outputs/flutter-apk/app-release.apk | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then
            echo "::error::The APK is debug-signed."
            exit 1
          fi
      - name: Prepare files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp example/build/app/outputs/flutter-apk/app-release.apk "dist/air-relay-$VERSION.apk"
          cp example/build/app/outputs/bundle/release/app-release.aab "dist/air-relay-$VERSION.aab"
          (cd dist && sha256sum "air-relay-$VERSION.apk" > "air-relay-$VERSION.apk.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: air-relay-bundle
          path: dist/*.aab
          if-no-files-found: error
      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk dist/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk dist/*.sha256 \
              --title "Air Relay $VERSION" --notes "See CHANGELOG.md. Verify the download with the .sha256 file."
          fi
